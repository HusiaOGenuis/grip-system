<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GRIP – Supabase Load Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>SUPABASE LOAD TEST</h1>
  <p>If you see this text, HTML is rendering.</p>

  <div id="status">Loading Supabase...</div>

  <script>
    // Wait for the script to load
    window.addEventListener('load', async () => {
      const statusEl = document.getElementById('status');

      try {
        // Check if the library loaded
        if (typeof supabase === 'undefined') {
          statusEl.innerHTML = '❌ Supabase library failed to load';
          console.error("supabase is undefined");
          return;
        }

        console.log("✅ Supabase library loaded successfully");
        console.log("supabase type:", typeof supabase);

        // Create the client (replace with your actual values)
        const supabaseUrl = 'https://your-project-ref.supabase.co';
        const supabaseKey = 'your-anon-key';

        const client = supabase.createClient(supabaseUrl, supabaseKey);

        console.log("✅ Supabase client created successfully");
        statusEl.innerHTML = '✅ Supabase client initialized successfully';

        // Optional: Test a simple query (uncomment when you have real credentials)
        // const { data, error } = await client.from('your_table').select('*').limit(1);
        // console.log("Test query:", { data, error });

      } catch (err) {
        console.error("Error initializing Supabase:", err);
        statusEl.innerHTML = `❌ Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
