<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GRIP Dashboard</title>

  <!-- Contract: raw static HTML, no pipeline -->
  <!-- Supabase UMD build (executes as global) -->
  <script src="https://cdn.jsdelivr.net/npm/@supe-js@2/dist/umd/supabase.js
</head>

<body>
  <h1>GRIP Dashboard</h1>
  <p>If you see this text, HTML is rendering.</p>

  <button id="login">Login</button>
  <button id="run">Run Evaluation</button>

  <pre id="output"></pre>

  <script>
    /* ===============================
       CONTRACT S — SCRIPT EXECUTION
       =============================== */

    if (typeof window.supabase !== "object") {
      document.getElementById("output").textContent =
        "ERROR: Supabase failed to load";
      throw new Error("Supabase not available");
    }

    document.getElementById("output").textContent =
      "Supabase loaded: object";

    /* ===============================
       CONTRACT A — AUTHENTICATION
       =============================== */

    const SUPABASE_URL = "https://lxldqhgevpssgkqtosnz.supabase.co";

    // IMPORTANT: keep this on ONE line only
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYm
      FzZSIsInJlZiI6Imx4bGRxaGdldnBzc2drcXRvc256Iiwicm9sZSI6Im
      Fub24iLCJpYXQiOjE3Nzc1MDEwOTYsImV4cCI6MjA5MzA3NzA5Nn0.Gn
      gx4y6VMrOBISyICnA-pcHpp3NIWq_VITKOTskg7MQ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.getElementById("login").onclick = async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.href
        }
      });
    };

    /* Check auth state on load */
    (async () => {
      const { data: { session } } =
        await supabaseClient.auth.getSession();

      document.getElementById("output").textContent =
        session ? "Authenticated: true" : "Authenticated: false";
    })();

    /* ===============================
       CONTRACT E — EDGE INVOCATION
       =============================== */

    const EDGE_BASE_URL = new URL(
      "https://lxldqhgevpssgkqtosnz.supabase.com"
    );

    document.getElementById("run").onclick = async () => {
      const { data: { session } } =
        await supabaseClient.auth.getSession();

      if (!session) {
        document.getElementById("output").textContent =
          "Not authenticated";
        return;
      }

      const decisionUrl = new URL(
        "/functions/v1/api/decision",
        EDGE_BASE_URL
      );

      const res = await fetch(decisionUrl.toString(), {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${session.access_token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ score: 82 })
      });

      document.getElementById("output").textContent =
        await res.text();
    };
  </script>
</body>
</html>
