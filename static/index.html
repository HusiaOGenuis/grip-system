<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GRIP – Auth Check</title>

  <!-- Raw static HTML, no pipeline -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>
  <h1>GRIP – Authentication</h1>
  <p>If you see this page, raw delivery is working.</p>

  <button id="login">Login with Google</button>
  <button id="logout">Logout</button>

  <pre id="status">Initializing…</pre>

  <script>
    // ---- CONTRACT: SUPABASE LOAD ----
    if (typeof window.supabase !== "object") {
      document.getElementById("status").textContent =
        "ERROR: Supabase failed to load";
      throw new Error("Supabase missing");
    }

    // ---- SUPABASE CONFIG ----
    const SUPABASE_URL = 
    "https://lxldqhgevpssgkqtosnz.supabase.co";
    const SUPABASE_ANON_KEY = 
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4bGRxaGdldnBzc2drcXRvc256Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDEwOTYsImV4cCI6MjA5MzA3NzA5Nn0.Gngx4y6VMrOBISyICnA-pcHpp3NIWq_VITKOTskg7MQ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const statusEl = document.getElementById("status");

    // ---- LOGIN ----
    document.getElementById("login").onclick = async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.href
        }
      });
    };

    // ---- LOGOUT ----
    document.getElementById("logout").onclick = async () => {
      await supabaseClient.auth.signOut();
      statusEl.textContent = "Logged out";
    };

    // ---- SESSION CHECK ----
    async function checkSession() {
      const { data: { session }, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        statusEl.textContent = "Session error:\n" + error.message;
        return;
      }

      if (session) {
        statusEl.textContent =
          "Authenticated: TRUE\n\nUser:\n" +
          JSON.stringify(session.user, null, 2);
      } else {
        statusEl.textContent = "Authenticated: FALSE";
      }
    }

    checkSession();
  </script>
</body>
</html>
