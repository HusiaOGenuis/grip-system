<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GRIP Dashboard</title>

  <!-- CONTRACT: external JS must be inside script -->
  <script>
    console.log("JS runtime loaded");
  </script>
</head>

<body>
  <h1>GRIP Dashboard</h1>
  <p>If you see this text, HTML is rendering.</p>

  <button id="login">Login</button>
  <button id="run">Run Evaluation</button>

  <pre id="output"></pre>

  <!-- CONTRACT: handlers registered after DOM exists -->
  <script>
    document.getElementById("login").onclick = () => {
      document.getElementById("output").textContent = "Login clicked";
    };

    document.getElementById("run").onclick = () => {
      document.getElementById("output").textContent = "Run Evaluation clicked";
    };
  </script>
</body>
</html>
