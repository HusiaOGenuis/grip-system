<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GRIP Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist.js</script>
</head>

<body>
  <h1>GRIP Dashboard</h1>
  <p>If you see this text, HTML is rendering.</p>

  <button id="login">Login</button>
  <button id="run">Run Evaluation</button>

  <pre id="output"></pre>

  <script>
    console.log("Supabase loaded:", typeof window.supabase);

    const SUPABASE_URL = "https://lxldqhgevpssgkqtosnz.supabase.co";

    // ✅ FIXED: single-line string
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4bGRxaGdldnBzc2drcXRvc256Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDEwOTYsImV4cCI6MjA5MzA3NzA5Nn0.Gngx4y6VMrOBISyICnA-pcHpp3NIWq_VITKOTskg7MQ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.getElementById("login").onclick = async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href }
      });
    };

    document.getElementById("run").onclick = async () => {
      document.getElementById("output").textContent =
        "Run Evaluation clicked";
    };

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      document.getElementById("output").textContent =
        session ? "Authenticated: true" : "Authenticated: false";
    })();
  </script>
</body>
</html>
